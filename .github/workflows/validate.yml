name: validate

on:
  push:
  pull_request:

jobs:
  free-graph-v0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate WAV-space specimen
        run: python3 scripts/fg.py validate specimens/wav-space-v0.public.json
      - name: Validate Bandcamp specimen
        run: python3 scripts/fg.py validate specimens/bandcamp-pressure-v0.public.json
